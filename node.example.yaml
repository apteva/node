# node.yaml — what this device is and what the agent may touch.
# Anything not declared here does not exist for the agent.

name: desk

server:
  # Your Apteva instance. For local development, run `go run ./cmd/node-sim`
  # and point here.
  url: http://127.0.0.1:7490
  token: dev-node-token
  # token_file: /var/lib/apteva-node/token   # preferred on a real device

ui:
  listen: 127.0.0.1:7480

hardware:
  gpio_chip: auto   # or /dev/gpiochip0
  i2c_bus: 1

safety:
  safe_state_after: 30s   # link down this long → outputs go to safe_state
  confirm_timeout: 30s    # unanswered approvals are denied

capabilities:
  - id: lamp
    kind: relay
    pin: 17
    description: the desk lamp
    safe_state: off

  - id: door
    kind: relay
    pin: 27
    description: the door strike
    confirm: hold     # Allow must be pressed and held on screen
    safe_state: off

  - id: status_led
    kind: led
    pin: 5
    description: the status LED

  - id: climate
    kind: i2c_sensor
    driver: bme280
    address: 0x76
    poll: 15s
    description: the room climate sensor
    events:
      - field: temperature_c
        above: 28

  - id: eye
    kind: camera
    index: 0          # camera port, as `rpicam-hello --list-cameras` numbers it
    width: 1280       # default photo size
    height: 720
    max_width: 1920   # largest size an agent may ask for (default: width/height)
    max_height: 1080
    rotation: 0       # 0 or 180, for how the camera is mounted
    hflip: false
    vflip: false
    description: the front camera
    confirm: screen   # cameras ask on screen unless you write confirm: none
